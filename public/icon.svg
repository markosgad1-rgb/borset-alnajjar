<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Inner Soft Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Golden Emblem Container -->
  <g filter="url(#shadow)">
    <!-- Central Shield / Circle -->
    <circle cx="256" cy="240" r="145" fill="#15803d" stroke="url(#goldGrad)" stroke-width="12"/>
    <circle cx="256" cy="240" r="130" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.7"/>

    <!-- Stylized Egg Graphic (Golden Egg) -->
    <path d="M 256 145 C 220 145 190 200 190 250 C 190 286 219 315 256 315 C 293 315 322 286 322 250 C 322 200 292 145 256 145 Z" fill="url(#goldGrad)"/>
    
    <!-- Egg Highlight -->
    <ellipse cx="238" cy="225" rx="20" ry="40" transform="rotate(-25 238 225)" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- Arabic Typography: النجار -->
  <text x="256" y="270" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="62" fill="#1e293b" letter-spacing="0">
    النجار
  </text>
  
  <!-- Banner Text: بورصة -->
  <rect x="166" y="375" width="180" height="42" rx="21" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="256" y="403" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="900" font-size="22" fill="#0c4a6e">
    بورصة النجار
  </text>
</svg>
